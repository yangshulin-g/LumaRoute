name: quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master, main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      RUST_TARGET: ${{ matrix.target }}
    steps:
      - name: Disable Git CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
          sudo service docker start || sudo systemctl start docker || true
          docker info
      - run: pnpm install --frozen-lockfile
      - name: Fetch verified mpv sidecar for Rust/Tauri build
        run: node scripts/fetch-mpv.mjs --target "${{ env.RUST_TARGET }}"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Rust tests with required real mpv sidecar
        run: pnpm test:rust
        env:
          LUMAROUTE_REQUIRE_REAL_MPV: '1'
      - run: pnpm check:boundaries
      - run: node --test scripts/verify-mpv.test.mjs
      - run: node scripts/verify-mpv.mjs manifest
      - name: Deterministic integration contracts (Jellyfin live deferred)
        run: pnpm --filter @lumaroute/integration exec vitest run --config vitest.config.ts --exclude '**/jellyfin-contract.test.ts'
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: UI journey E2E
        run: pnpm test:e2e
        env:
          VITE_E2E: '1'
