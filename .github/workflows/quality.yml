name: quality

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-13, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:rust
      - run: pnpm check:boundaries
      - run: node --test scripts/verify-mpv.test.mjs
      - run: node scripts/verify-mpv.mjs manifest
      - name: Integration contracts
        run: pnpm test:integration
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: UI journey E2E
        run: pnpm test:e2e
        env:
          VITE_E2E: '1'
