name: package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles msi,nsis
          - os: macos-13
            target: x86_64-apple-darwin
            args: --bundles app,dmg
          - os: macos-14
            target: aarch64-apple-darwin
            args: --bundles app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    env:
      RUST_TARGET: ${{ matrix.target }}
      BUNDLE_ARGS: ${{ matrix.args }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: pnpm install --frozen-lockfile
      - run: node scripts/fetch-mpv.mjs --target "$RUST_TARGET"
      - run: node scripts/verify-mpv.mjs installed --target "$RUST_TARGET"
      - name: Build unsigned desktop packages
        run: pnpm --filter @lumaroute/desktop tauri build --target "$RUST_TARGET" $BUNDLE_ARGS
      - run: node scripts/package-checksums.mjs apps/desktop/src-tauri/target
      - run: node scripts/smoke-packaged.mjs --target "$RUST_TARGET"
      - name: Record acceptance pointer
        run: |
          echo "Attach this workflow run URL to docs/release/v0.1-acceptance.md automated packaging evidence."
          echo "run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumaroute-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/**/*.msi
            apps/desktop/src-tauri/target/**/*-setup.exe
            apps/desktop/src-tauri/target/**/*.dmg
            apps/desktop/src-tauri/target/**/*.AppImage
            apps/desktop/src-tauri/target/**/*.deb
            apps/desktop/src-tauri/target/**/*.sha256
            apps/desktop/src-tauri/target/**/UNSIGNED-DEVELOPMENT-BUILD.txt
